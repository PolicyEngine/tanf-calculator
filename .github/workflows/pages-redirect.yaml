name: Deploy Pages redirect

# Publishes a small "this app has moved" page to the legacy GitHub Pages URL
# (https://policyengine.github.io/tanf-calculator/) that redirects visitors to
# the current app on Vercel (https://www.policyengine.org/us/tanf-calculator).
# The real app deploys via Vercel; this only keeps old links working.

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages-redirect.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
